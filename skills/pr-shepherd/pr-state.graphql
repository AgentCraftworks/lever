# One read per wake. Everything pr-shepherd needs to decide, in a single call:
#   gh api graphql -F owner=OWNER -F repo=REPO -F number=123 -F query=@pr-state.graphql
query PrState($owner: String!, $repo: String!, $number: Int!) {
  rateLimit { cost remaining resetAt }
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $number) {
      number
      url
      state
      isDraft
      baseRefName
      headRefName
      headRefOid
      mergeable
      mergeStateStatus
      reviewDecision
      autoMergeRequest { enabledAt mergeMethod }
      mergeQueueEntry { state position }
      commits(last: 1) {
        nodes {
          commit {
            oid
            statusCheckRollup {
              state
              contexts(first: 100) {
                nodes {
                  __typename
                  ... on CheckRun {
                    name
                    status
                    conclusion
                    detailsUrl
                    isRequired(pullRequestNumber: $number)
                    checkSuite { workflowRun { databaseId runAttempt } }
                  }
                  ... on StatusContext {
                    context
                    state
                    targetUrl
                    isRequired(pullRequestNumber: $number)
                  }
                }
              }
            }
          }
        }
      }
      reviewThreads(first: 100) {
        nodes {
          id
          isResolved
          isOutdated
          path
          line
          first: comments(first: 1) { nodes { databaseId author { login } body url } }
          last: comments(last: 1) { nodes { author { login } createdAt } }
        }
      }
    }
  }
}
